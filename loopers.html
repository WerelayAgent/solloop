    var toast = document.createElement('div');
    toast.id = 'solloop-toast';
    toast.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#101A12;color:#CCFF00;border:1px solid #233823;padding:10px 20px;border-radius:12px;font-size:13px;font-weight:600;z-index:99999;box-shadow:0 10px 30px rgba(0,0,0,0.8);display:flex;align-items:center;gap:8px;font-family:inherit;';
    toast.innerHTML = '<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#CCFF00;"></span>' + msg;
    document.body.appendChild(toast);
    setTimeout(function() {
      toast.style.opacity = '0';
      toast.style.transition = 'opacity 0.3s ease';
      setTimeout(function() { toast.remove(); }, 300);
    }, 2800);
  }

  function openWalletModal() {
    var existing = document.getElementById('solana-wallet-modal');
    if (existing) { existing.remove(); return; }

    var modal = document.createElement('div');
    modal.id = 'solana-wallet-modal';
    modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.75);backdrop-filter:blur(8px);z-index:999999;display:flex;align-items:center;justify-content:center;padding:16px;';
    
    var currentWallet = localStorage.getItem('solloop_connected_wallet');
    var modalContent = '';
    
    if (currentWallet) {
      modalContent = `
        <div style="background:#0b0c0b;border:1px solid #232723;border-radius:20px;padding:24px;width:100%;max-width:380px;box-shadow:0 20px 50px rgba(0,0,0,0.9);color:#fff;font-family:inherit;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;">
            <div style="font-size:16px;font-weight:700;">Connected Wallet</div>
            <button id="modal-close" style="background:none;border:none;color:#888;cursor:pointer;font-size:20px;padding:4px;">&times;</button>
          </div>
          <div style="background:#141714;border:1px solid #222922;border-radius:12px;padding:14px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;">
            <div style="display:flex;align-items:center;gap:10px;">
              <span style="width:10px;height:10px;border-radius:50%;background:#CCFF00;display:inline-block;"></span>
              <span style="font-family:monospace;font-size:14px;font-weight:600;">` + currentWallet.slice(0, 4) + '...' + currentWallet.slice(-4) + `</span>
            </div>
            <span style="font-size:11px;background:#223322;color:#CCFF00;padding:2px 8px;border-radius:6px;font-weight:600;">Solana</span>
          </div>
          <div style="font-size:13px;color:#888;margin-bottom:18px;display:flex;justify-content:space-between;">
            <span>Simulated Balance:</span>
            <span style="color:#fff;font-weight:600;">14.85 SOL</span>
          </div>
          <button id="disconnect-wallet-btn" style="width:100%;background:#ff333320;color:#ff5555;border:1px solid #ff333340;border-radius:12px;padding:12px;font-weight:600;font-size:14px;cursor:pointer;transition:all 0.2s;">Disconnect</button>
        </div>
      `;
    } else {
      modalContent = `
        <div style="background:#0b0c0b;border:1px solid #232723;border-radius:20px;padding:24px;width:100%;max-width:390px;box-shadow:0 20px 50px rgba(0,0,0,0.9);color:#fff;font-family:inherit;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
            <div>
              <div style="font-size:17px;font-weight:700;">Connect Solana Wallet</div>
              <div style="font-size:12px;color:#888;margin-top:2px;">Select a Solana wallet to continue</div>
            </div>
            <button id="modal-close" style="background:none;border:none;color:#888;cursor:pointer;font-size:22px;padding:4px;">&times;</button>
          </div>
          <div style="display:flex;flex-direction:column;gap:10px;margin-top:16px;">
            <button class="wallet-select-btn" data-wallet="Phantom" style="display:flex;align-items:center;justify-content:space-between;background:#141714;border:1px solid #222922;border-radius:14px;padding:14px 16px;color:#fff;cursor:pointer;font-family:inherit;transition:all 0.15s;text-align:left;">
              <div style="display:flex;align-items:center;gap:12px;">
                <div style="width:34px;height:34px;border-radius:10px;background:#AB9FF2;display:flex;align-items:center;justify-content:center;color:#000;font-weight:900;font-size:17px;">👻</div>
                <div>
                  <div style="font-weight:600;font-size:14px;">Phantom</div>
                  <div style="font-size:11px;color:#888;">Most popular Solana wallet</div>
                </div>
              </div>
              <span style="font-size:11px;color:#CCFF00;font-weight:600;">Detected</span>
            </button>
            <button class="wallet-select-btn" data-wallet="Solflare" style="display:flex;align-items:center;justify-content:space-between;background:#141714;border:1px solid #222922;border-radius:14px;padding:14px 16px;color:#fff;cursor:pointer;font-family:inherit;transition:all 0.15s;text-align:left;">
              <div style="display:flex;align-items:center;gap:12px;">
                <div style="width:34px;height:34px;border-radius:10px;background:#FC6027;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:16px;">⚡</div>
                <div>
                  <div style="font-weight:600;font-size:14px;">Solflare</div>
                  <div style="font-size:11px;color:#888;">Solana native wallet</div>
                </div>
              </div>
              <span style="font-size:11px;color:#888;">Connect</span>
            </button>
            <button class="wallet-select-btn" data-wallet="Backpack" style="display:flex;align-items:center;justify-content:space-between;background:#141714;border:1px solid #222922;border-radius:14px;padding:14px 16px;color:#fff;cursor:pointer;font-family:inherit;transition:all 0.15s;text-align:left;">
              <div style="display:flex;align-items:center;gap:12px;">
                <div style="width:34px;height:34px;border-radius:10px;background:#E33E38;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:16px;">🎒</div>
                <div>
                  <div style="font-weight:600;font-size:14px;">Backpack</div>
                  <div style="font-size:11px;color:#888;">Web3 xNFT wallet</div>
                </div>
              </div>
              <span style="font-size:11px;color:#888;">Connect</span>
            </button>
          </div>
          <div style="margin-top:16px;text-align:center;font-size:11px;color:#666;">
            By connecting, you agree to SolLoop Terms of Service.
          </div>
        </div>
      `;
    }
    
    modal.innerHTML = modalContent;
    document.body.appendChild(modal);

    modal.querySelector('#modal-close').onclick = function() { modal.remove(); };
    modal.onclick = function(e) { if (e.target === modal) modal.remove(); };

    var dBtn = modal.querySelector('#disconnect-wallet-btn');
    if (dBtn) {
      dBtn.onclick = function() {
        localStorage.removeItem('solloop_connected_wallet');
        updateWalletButtons(null);
        showToast("Wallet Disconnected");
        modal.remove();
      };
    }

    modal.querySelectorAll('.wallet-select-btn').forEach(function(btn) {
      btn.onclick = function() {
        var walletType = this.getAttribute('data-wallet');
        connectSolanaWallet(walletType, modal);
      };
    });
  }

  function connectSolanaWallet(type, modal) {
    var generatedAddr = 'SoL7' + Math.random().toString(36).substring(2, 8) + '94pQ';
    if (window.solana && window.solana.isPhantom && type === 'Phantom') {
      window.solana.connect().then(function(res) {
        var addr = res.publicKey.toString();
        finishConnection(addr, type, modal);
      }).catch(function() {
        finishConnection(generatedAddr, type, modal);
      });
    } else {
      finishConnection(generatedAddr, type, modal);
    }
  }

  function finishConnection(addr, type, modal) {
    localStorage.setItem('solloop_connected_wallet', addr);
    updateWalletButtons(addr);
    showToast(type + " Connected: " + addr.slice(0, 4) + '...' + addr.slice(-4));
    if (modal) modal.remove();
  }

  function updateWalletButtons(addr) {
    var btns = document.querySelectorAll('button');
    btns.forEach(function(b) {
      var txt = b.textContent.trim();
      if (txt === 'Connect wallet' || txt === 'Connect' || b.getAttribute('data-wallet-btn') === 'true' || b.querySelector('.lucide-wallet')) {
        b.setAttribute('data-wallet-btn', 'true');
        if (addr) {
          b.innerHTML = '<span style="display:inline-flex;align-items:center;gap:6px;"><span style="width:8px;height:8px;border-radius:50%;background:#CCFF00;display:inline-block;"></span>' + addr.slice(0, 4) + '…' + addr.slice(-4) + '</span>';
        } else {
          b.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-wallet"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"></path><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"></path></svg><span class="hidden min-[421px]:inline">Connect wallet</span><span class="min-[421px]:hidden">Connect</span>';
        }
      }
    });
  }

  // Hook wallet button clicks
  document.addEventListener('click', function(e) {
    var btn = e.target.closest('button');
    if (!btn) return;
    var txt = btn.textContent.trim();
    if (txt === 'Connect wallet' || txt === 'Connect' || btn.getAttribute('data-wallet-btn') === 'true' || (btn.querySelector('.lucide-wallet') && !btn.closest('#solana-wallet-modal'))) {
      e.preventDefault();
      e.stopPropagation();
      openWalletModal();
    }
  }, true);

  // Auto restore wallet on load
  document.addEventListener('DOMContentLoaded', function() {
    var saved = localStorage.getItem('solloop_connected_wallet');
    if (saved) updateWalletButtons(saved);
  });
  setTimeout(function() {
    var saved = localStorage.getItem('solloop_connected_wallet');
    if (saved) updateWalletButtons(saved);
  }, 500);
})();
</script>


<script>
// Ensure instant hard navigation between static pages
document.addEventListener('click', function(e) {
  var a = e.target.closest('a');
  if (a && a.href && a.origin === window.location.origin) {
    var p = a.pathname;
    if (p && p !== window.location.pathname && !p.startsWith('#') && !a.getAttribute('href').startsWith('#') && !p.includes('.')) {
      e.preventDefault();
      window.location.href = a.href;
    }
  }
}, true);
</script>
